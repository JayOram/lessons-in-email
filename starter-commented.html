<!-- HTML5 Doctype for the latest HTML attribute support -->
<!DOCTYPE html>

<!-- html element:

lang="en" 
lang is set to the language of the email. 

xmlns:v="urn:schemas-microsoft-com:vml" 
This xmlns is to bring in the schema for Microsoft Word Rendering engines Vector Markup Language or VML - If you are not using VML, it can be removed. 
No need to repeat this on every VML element, setting it once in the head is enough.

xmlns:o="urn:schemas-microsoft-com:office:office"
This xmlns is to bring in the schema for Microsoft Word Rendering engines Office settings - including the fix for Outlook 120dpi and the advanced typography settings.

-->
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<!-- Fake head of Yahoo app on Android: 
Relates to this bug (Closed Aug 2025) - https://github.com/hteumeuleu/email-bugs/issues/28 
This can most likely be removed now, but as some testing services show an error and not all Yahoo apps may be up todat, it may be worth keeping
-->  
  <head></head>
  <head>
     
    <!-- Setting the character set and endcoding to UTF-8  -->
    <meta charset="utf-8">

    <!-- Sets the width to the actual device width, rather than taking the fallback (iOS's original width - 980px) width from desktop and scaling it down -->
    <meta name="viewport" content="width=device-width" />

    <!-- iOS specific format-detection to stop auto linking elements -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">

    <!-- Apple specific fix to stop iOS formatting elements in your email - originating in iOS 10 with added right margin -->
    <meta name="x-apple-disable-message-reformatting" />

    <!-- Dark mode meta tag - remove unless adding Dark mode CSS -->
    <meta name="color-scheme" content="light dark" />

    <!-- Dark mode meta tag - Include to force Gmail light mode -->
    <meta name="color-scheme" content="light only" />

    <!-- Title of your document -->
    <title></title>

    <!-- CSS normalise - https://github.com/JayOram/email-css-resets/blob/main/CSS-normalise.css -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }

      * {
        box-sizing: border-box;
      }

      table {
        border-collapse: collapse;
        mso-table-lspace: 0;
        mso-table-rspace: 0;
      }

      u+.body a {
        color: inherit;
        text-decoration: none;
        font-size: inherit;
        font-weight: inherit;
        line-height: inherit;
      }
    </style>

    <!-- Link resets - https://github.com/JayOram/email-css-resets/blob/main/css-link-resets.md -->
    <style>
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }

      a {
        color:inherit;
        mso-color-alt: windowtext;
        text-decoration: none;
      }

      span.MsoHyperlink {
        color: inherit !important;
        mso-style-priority: 99 !important;
      }

      span.MsoHyperlinkFollowed {
        color: inherit !important;
        mso-style-priority: 99 !important;
      }
    </style>

    <!-- Custom fonts example -->
    <style>
      @media screen {
        @font-face {
          font-family: 'Open Sans';
          /* Using fonts.bunny.net as a GDPR compliant Google font link */
          src: url('https://fonts.bunny.net/open-sans/files/open-sans-latin-800-normal.woff2') format('woff2');
          /* If a font is already bold it is important to include font-weight: bold; otherwise apple mail will 'bold' a bold font! */
          font-weight: bold;
        }
      }
    </style>

    <!-- Mobile changes - starter set of mobile specific classes for responsive email development -->
    <style>
      @media screen and (max-width:640px) {
        .w100pc {
          width: 100% !important;
          min-width: 100% !important;
          max-width: 1000px !important;
          height: auto !important;
        }

        .show {
          display: block !important;
          overflow: visible !important;
          float: none !important;
          width: 100% !important;
          height: auto !important;
          max-height: inherit !important;
        }

        .nomob {
          display: none !important;
        }

        .colsplit {
          width: 100% !important;
          float: left !important;
          display: block !important;
        }

        .colsplit-top {
          width: 100% !important;
          display: table-row-group !important;
        }

        .colsplit-bottom {
          width: 100% !important;
          display: table-footer-group !important;
        }
  
        #MessageViewBody,
        #MessageWebViewDiv {
          width: 100% !important;
        }
      }
    </style>

    <!-- Dark mode CSS -->
    <style>
      /* Apple and clients that support prefers-color-scheme */
      :root {
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        .lightimage {
          display: none !important;
        }

        .darkimage {
          display: block !important;
        }

        td,
        th {
          background-color: rgb(21, 19, 18) !important;
        }

        * {
          color: rgb(255, 255, 255) !important;
        }

        .button {
          background-color: #6d6d6d !important;
          background-image: linear-gradient(rgb(109, 109, 109), rgb(109, 109, 109)) !important;
          border-color: #6d6d6d !important;
        }
      }

      /* Outlook app and webmail specific dark mode fixes */
      [data-ogsc] .lightimage {
        display: none !important;
      }

      [data-ogsc] .darkimage {
        display: block !important;
      }

      [data-ogsb] td,
      [data-ogsb] th {
        background-color: rgb(21, 19, 18) !important;
      }

      [data-ogsb] {
        color: rgb(255, 255, 255) !important;
      }

      [data-ogsb] .button {
        background-color: #6d6d6d !important;
        background-image: linear-gradient(rgb(109, 109, 109), rgb(109, 109, 109)) !important;
        border-color: #6d6d6d !important;
      }
    </style>
  </head>

  <!-- body element 
  
  Setting class="body" to allow Gmail targeting 
  xml:lang to match the lang in the <html> element - specifically for Outlook Windows Desktop
  
  -->
  <body class="body" xml:lang="en">

    <!-- Accessible wrapper 

    Webmail clients remove the <head> and html element.

    role="article" separates the content from the rest of the website, effectively marking it as a separate document.
    aria-roledescription="email" - Defines a human-readable, author-localized description for the role of an element.
    aria-label="..." - An invisible text label for your email content, as <title> could be removed in email clients.
    lang="en" - set the language if body and html are not included
    dir="..." - set the language direction. This could be set to auto, but if possible to localise, we can set it to ltr or rtl.
    style="font-size:medium; font-size:max(16px, 1rem)" - sets a minimum font-size for the email. 
    
    -->
    <div role="article" aria-roledescription="email" aria-label="email name" lang="en" dir="ltr" style="font-size:medium; font-size:max(16px, 1rem)">

      <!-- email content in here -->

    </div>

    <!-- Outlook 120dpi and Advanced Typography fix -->
    <span style="display: none">
    <xml>
    <o:OfficeDocumentSettings>
    <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    <w:WordDocument>
    <w:DontUseAdvancedTypographyReadingMail/>
    </w:WordDocument>
    </xml>
    </span>
    
  </body>
</html>
